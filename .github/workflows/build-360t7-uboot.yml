name: 360T7 U-Boot 2025 (备份/Factory/DHCP)

on:
  workflow_dispatch:
    inputs:
      VARIANT:
        description: '分区布局: default=原厂/通用(与你现有分区一致, 推荐) / ubootmod=OpenWrt UBI 布局 / nonmbm=关闭 NMBM'
        required: true
        default: 'default'
        type: choice
        options:
          - default
          - ubootmod
          - nonmbm
      BOOTMODE:
        description: '启动卷: auto=自动探测(kernel->fit->production, SWRT 和 OpenWrt 通吃, 推荐) / kernel=只认 SWRT / fit=只认 OpenWrt ITB / production=新版默认'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - kernel
          - fit
          - production
      VERSION:
        description: 'ATF 版本: all=三个都编(推荐, 挑能用的) / SP1=ATF 20241017(老内核固件更稳) / 2025=最新 / SP2=ATF 20260123'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - SP1
          - 2025
          - SP2
      DHCPD:
        description: '开启 DHCP 服务(电脑自动获取 IP, 无需手动设静态 IP)'
        required: false
        default: 'true'
        type: boolean
      NOMENU:
        description: '关掉开机启动菜单: MTK 菜单在 bootdelay 之前弹出且可能无限等待, bootcmd 轮不到执行(不自动启动的真凶)。实现方式是给 common/autoboot.c 打补丁, 不动 Kconfig(关 Kconfig 会链接失败或弄坏备份)'
        required: false
        default: 'true'
        type: boolean
      ENVFIX:
        description: '避开旧 bootcmd: 把 env 挪到 u-boot-env 分区后半段, 旧 uboot 残留的 bootcmd 就失效了(刷上即用)'
        required: false
        default: 'true'
        type: boolean
      SIMG:
        description: '开启全片镜像(SIMG)升级'
        required: false
        default: 'true'
        type: boolean
      NAND_RAW:
        description: '开启 NAND 原始(OOB)备份, 含坏块信息, 还原最完整但风险高'
        required: false
        default: 'false'
        type: boolean
      FSTHEME:
        description: '救援界面主题'
        required: false
        default: 'bootstrap'
        type: choice
        options:
          - bootstrap
          - gl
          - mtk

env:
  TZ: Asia/Shanghai
  MODEL: qihoo_360t7
  VARIANT: ${{ github.event.inputs.VARIANT || 'default' }}
  BOOTMODE: ${{ github.event.inputs.BOOTMODE || 'auto' }}
  DHCPD: ${{ github.event.inputs.DHCPD || 'true' }}
  NOMENU: ${{ github.event.inputs.NOMENU || 'true' }}
  ENVFIX: ${{ github.event.inputs.ENVFIX || 'true' }}
  SIMG: ${{ github.event.inputs.SIMG || 'true' }}
  NAND_RAW: ${{ github.event.inputs.NAND_RAW || 'false' }}
  FSTHEME: ${{ github.event.inputs.FSTHEME || 'bootstrap' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # VERSION=all 时三个 ATF 版本都编, 挑能启动的那个刷
        version: ${{ fromJSON(github.event.inputs.VERSION == 'all' && '["SP1","2025","SP2"]' || format('["{0}"]', github.event.inputs.VERSION || 'SP1')) }}
    env:
      VERSION: ${{ matrix.version }}

    steps:
      - name: 检出源码
        run: |
          git clone --depth 1 https://github.com/Yuzhii0718/bl-mt798x-dhcpd bl-mt798x-dhcpd
          echo "SOURCE_SHA=$(git -C bl-mt798x-dhcpd rev-parse HEAD)" >> $GITHUB_ENV

      - name: 安装编译依赖
        run: |
          sudo -E apt-get -qq update
          PKGS="gcc-aarch64-linux-gnu build-essential flex bison libssl-dev device-tree-compiler qemu-user-static rename tar"
          if [ -f bl-mt798x-dhcpd/depends/ubuntu-22.04 ]; then
            PKGS="$PKGS $(cat bl-mt798x-dhcpd/depends/ubuntu-22.04)"
          fi
          sudo -E apt-get -qq install $PKGS
          sudo timedatectl set-timezone "$TZ"

      - name: 开启功能开关
        run: |
          set -e
          cd bl-mt798x-dhcpd
          case "$VARIANT" in
            default)  CFG=uboot-mtk-20250711/configs/mt7981_qihoo_360t7_defconfig ;;
            nonmbm)   CFG=uboot-mtk-20250711/configs-nonmbm/mt7981_qihoo_360t7_defconfig ;;
            ubootmod) CFG=uboot-mtk-20250711/configs-ubi/mt7981_qihoo_360t7_defconfig ;;
            *) echo "未知 VARIANT: $VARIANT"; exit 1 ;;
          esac
          echo "机型配置: $CFG"
          # 三条命令必须用分号隔开(等价于逐条回车), 连在一起写只会被当成一条命令。
          # auto: 先探 kernel 卷(SWRT/华硕官改), 没有再试 fit 卷(OpenWrt 官方 ITB),
          #       最后兜底 production(新版 uboot 布局)。换固件不用重刷 uboot。
          #       依赖 CONFIG_HUSH_PARSER=y 和 ubi check 命令, defconfig 里都有。
          case "$BOOTMODE" in
            kernel)     BCMD='ubi part ubi ; ubi read 0x46000000 kernel ; bootm 0x46000000' ;;
            fit)        BCMD='ubi part ubi ; ubi read 0x46000000 fit ; bootm 0x46000000' ;;
            production) BCMD='' ;;
            auto)       BCMD='ubi part ubi ; if ubi check kernel ; then ubi read 0x46000000 kernel ; bootm 0x46000000 ; else if ubi check fit ; then ubi read 0x46000000 fit ; bootm 0x46000000 ; else ubi read 0x46000000 production ; bootm 0x46000000 ; fi ; fi' ;;
          esac
          echo "BCMD=$BCMD" >> $GITHUB_ENV
          {
            echo ''
            echo '# ===== 360T7 自定义功能 ====='
            echo 'CONFIG_MTK_WEB_FAILSAFE=y'
            echo 'CONFIG_MTK_WEB_FAILSAFE_AFTER_BOOT_FAILURE=y'
            if [ "$DHCPD" = "true" ]; then
              echo 'CONFIG_MTK_DHCPD=y'
              echo 'CONFIG_MTK_DHCPD_USE_CONFIG_IP=y'
            fi
            echo 'CONFIG_WEBUI_FAILSAFE_BACKUP=y'
            echo 'CONFIG_WEBUI_FAILSAFE_FACTORY=y'
            echo 'CONFIG_WEBUI_FAILSAFE_ADVANCED=y'
            echo 'CONFIG_WEBUI_FAILSAFE_FLASH=y'
            echo 'CONFIG_WEBUI_FAILSAFE_CONSOLE=y'
            echo 'CONFIG_WEBUI_FAILSAFE_ENV=y'
            echo 'CONFIG_WEBUI_FAILSAFE_I18N=y'
            # 旧版 uboot 靠 Boot Menu 自动探测, 新版默认走 production/recovery 卷,
            # 而 SWRT/华硕官改固件的实际卷名是 kernel —— 对不上就起不来。
            # 注意: CONFIG_USE_BOOTCOMMAND 在 Kconfig 里没有 default(默认 n),
            #       不开它的话 CONFIG_BOOTCOMMAND 会被 olddefconfig 直接丢掉。
            if [ -n "$BCMD" ]; then
              echo 'CONFIG_USE_BOOTCOMMAND=y'
              echo "CONFIG_BOOTCOMMAND=\"$BCMD\""
            fi
          } >> "$CFG"
          # ---- ENVFIX: 让编译进去的 bootcmd 真正生效(刷上就能用) ----
          # u-boot-env 分区 512k, 旧 uboot 把 env 写在偏移 0。
          # 新 uboot 上电先读 flash env, 读到就完全不听编译值了 —— 所以必须让它读不到。
          # 挪到 0x40000(256k 处): 128k / 256k 两种擦除块大小都能对齐,
          # 且 env 区 0x40000~0x60000 仍在 512k 分区内, 不会越界。
          # 读不到旧 env -> CRC 校验失败 -> 自动用编译内置默认 env(里面就是我们要的 bootcmd)。
          # sed 必须放在上面的追加块之后: 块内 sed -i 会换 inode, 后面的 echo 会写飞。
          if [ "$ENVFIX" = "true" ]; then
            sed -i '/^CONFIG_ENV_OFFSET=/d' "$CFG"
            echo '# 避开旧 uboot 残留的 env, 把 env 挪到 u-boot-env 分区后半段' >> "$CFG"
            echo 'CONFIG_ENV_OFFSET=0x40000' >> "$CFG"
          fi
          # ---- 开机菜单: 这里刻意不动任何 Kconfig, 只留 BOOTDELAY ----
          # 菜单相关的三个宏被源码结构绑死, 单改任意一个都会链接失败(实测):
          #   1. common/autoboot.c:499  if (IS_ENABLED(CONFIG_AUTOBOOT_MENU_SHOW))
          #          -> run_command("mtkautoboot") 或 menu_show()
          #   2. menu_show() 定义在 cmd/bootmenu.c:658 的
          #          #ifdef CONFIG_AUTOBOOT_MENU_SHOW   里面
          #   3. cmd_mtkautoboot.c:111 无条件调用 menu_show(),
          #      它由 CONFIG_MEDIATEK_BOOTMENU 控制编译
          #      => 关 AUTOBOOT_MENU_SHOW 而留 MEDIATEK_BOOTMENU
          #         -> undefined reference to `menu_show'
          #   4. CONFIG_MEDIATEK_BOOTMENU 还 select MTD, 而且管着
          #      board/mediatek/common/mtd_helper.o —— 网页救援的
          #      backup.c / upgrade.c 要用 mtd_read_skip_bad /
          #      gen_mtd_probe_devices / mtd_nmbm_enabled, 全在里面
          #      => 删 MEDIATEK_BOOTMENU 会把备份和刷机一起弄坏
          # 所以: 保持这三个宏全开(= 上游原版, 链接必然通过),
          #       改由下一步给 common/autoboot.c 打一行补丁来跳过菜单。
          echo 'CONFIG_BOOTDELAY=2' >> "$CFG"
          echo "--- 追加的开关(末尾) ---"
          tail -36 "$CFG"

      - name: 关闭开机菜单(源码补丁)
        run: |
          set -e
          cd bl-mt798x-dhcpd
          AB=uboot-mtk-20250711/common/autoboot.c
          if [ "$NOMENU" != "true" ]; then
            echo 'NOMENU=false, 保留开机菜单(适合想用菜单选启动项的场景)'
            exit 0
          fi
          echo "--- 补丁前 ---"
          grep -n 'AUTOBOOT_MENU_SHOW' "$AB" || true
          # bootdelay_process() 里这段在 "s = env_get(bootcmd)" 之前执行,
          # mtkautoboot 一旦不返回(delay=-1 时无限等待), bootcmd 永远轮不到。
          # 这里只把判断条件改成 0, 菜单代码本身照常编译 ——
          # 所以 menu_show 符号还在, 链接不会断, 网页救援也照常工作。
          sed -i 's|if (IS_ENABLED(CONFIG_AUTOBOOT_MENU_SHOW)) {|if (0) { /* 360T7: 关掉开机菜单, 让 bootcmd 执行 */|' "$AB"
          echo "--- 补丁后 ---"
          grep -n 'AUTOBOOT_MENU_SHOW\|if (0)' "$AB" || true
          if grep -q 'if (0) { /\* 360T7' "$AB"; then
            echo 'OK  补丁已生效: 上电不再弹菜单'
          else
            echo '!!  补丁没打上(源码行可能变了), 刷上还会被菜单挡住'
            exit 1
          fi

      - name: 修正默认 env 文件(双保险)
        run: |
          set -e
          cd bl-mt798x-dhcpd/uboot-mtk-20250711/defenvs || exit 0
          if [ -z "$BCMD" ]; then echo 'BOOTMODE=production, 跳过'; exit 0; fi
          # 源码里 defenvs/qihoo-360t7_env 默认 bootcmd=...run boot_ubi...,
          # 而 boot_ubi -> boot_production -> ubi read fit, SWRT 没有 fit 卷, 必挂。
          # 万一走了 defenvs 这条路, 这里直接把 bootcmd 改成对的。
          for f in qihoo-360t7_env qihoo-360t7-ubi_env custom_env; do
            [ -f "$f" ] || continue
            echo "修正 $f"
            sed -i '/^bootcmd=/d' "$f"
            printf 'bootcmd=%s\n' "$BCMD" >> "$f"
            # 上游这份 env 里 bootdelay=0(直接启动, 没法按键打断)。
            # 留 2 秒窗口: 上电按任意键可进命令行调试, 不按就自动进系统。
            sed -i '/^bootdelay=/d' "$f"
            printf 'bootdelay=2\n' >> "$f"
          done

      - name: 生成 .config
        run: |
          set -e
          cd bl-mt798x-dhcpd
          touch uboot-mtk-20250711/.config
          make defconfig 2>&1 || true
          touch .config
          config_apply() {
            local key="$1" value="$2"
            if [ "$value" = "y" ]; then
              sed -i "s/^# $key is not set\$/$key=y/" .config
              grep -q "^$key=" .config || echo "$key=y" >> .config
            elif [ "$value" = "n" ]; then
              sed -i "s/^$key=y\$/# $key is not set/" .config
            else
              sed -i "s|^$key=.*|$key=$value|" .config
              grep -q "^$key=" .config || echo "$key=$value" >> .config
            fi
          }
          config_apply CONFIG_BUILD_FIP y
          config_apply CONFIG_BUILD_ATF n
          config_apply CONFIG_BUILD_GPT n
          config_apply CONFIG_COPY_BL2 y
          config_apply CONFIG_VERSION_2025 n
          config_apply CONFIG_VERSION_SP1 n
          config_apply CONFIG_VERSION_SP2 n
          case "$VERSION" in
            2025) config_apply CONFIG_VERSION_2025 y ;;
            SP1)  config_apply CONFIG_VERSION_SP1 y ;;
            SP2)  config_apply CONFIG_VERSION_SP2 y ;;
            *) echo "未知 VERSION: $VERSION"; exit 1 ;;
          esac
          config_apply CONFIG_VARIANT_DEFAULT n
          config_apply CONFIG_VARIANT_NONMBM n
          config_apply CONFIG_VARIANT_UBOOTMOD n
          config_apply CONFIG_VARIANT_UBI n
          config_apply CONFIG_VARIANT_OPENWRT n
          case "$VARIANT" in
            default)  config_apply CONFIG_VARIANT_DEFAULT y ;;
            nonmbm)   config_apply CONFIG_VARIANT_NONMBM y ;;
            ubootmod) config_apply CONFIG_VARIANT_UBOOTMOD y ;;
          esac
          config_apply CONFIG_FSTHEME_BOOTSTRAP n
          config_apply CONFIG_FSTHEME_GL n
          config_apply CONFIG_FSTHEME_MTK n
          config_apply "CONFIG_FSTHEME_$(echo "$FSTHEME" | tr '[:lower:]' '[:upper:]')" y
          config_apply CONFIG_MULTI_LAYOUT n
          config_apply CONFIG_FIXED_MTDPARTS y
          config_apply CONFIG_SIMG "$([ "$SIMG" = "true" ] && echo y || echo n)"
          config_apply CONFIG_NAND_RAW "$([ "$NAND_RAW" = "true" ] && echo y || echo n)"
          config_apply CONFIG_SILENT y
          config_apply CONFIG_BUILD_LOG y
          echo "=== 最终 .config ==="
          cat .config

      - name: 编译 FIP
        run: |
          cd bl-mt798x-dhcpd
          mkdir -p output
          make BOARD=qihoo_360t7 VERSION="$VERSION" VARIANT="$VARIANT" MULTI_LAYOUT=0 FIXED_MTDPARTS=1 build 2>&1
          echo "FILE_DATE=$(date +%Y.%m.%d-%H%M)" >> $GITHUB_ENV
          echo "=== 产物 ==="
          ls -l output/

      - name: 自检编译结果
        run: |
          cd bl-mt798x-dhcpd
          CFG=uboot-mtk-20250711/.config
          AUTOCONF=uboot-mtk-20250711/include/config/autoconf.h
          FAIL=0
          chk() { # chk <说明> <grep 到的判定命令>
            if eval "$2"; then echo "OK   $1"; else echo "!!   $1"; FAIL=1; fi
          }

          echo "=== env 位置配置 ==="
          grep -E '^(CONFIG_ENV_OFFSET|CONFIG_ENV_SIZE|CONFIG_ENV_SIZE_REDUND|CONFIG_ENV_IS_IN_MTD|CONFIG_ENV_MTD_DEV|CONFIG_ENV_MTD_NAME)=' "$CFG" || true

          echo "=== 1. bootcmd 编进去了吗 ==="
          grep -E 'define CONFIG_(USE_BOOTCOMMAND|BOOTCOMMAND)' "$AUTOCONF" || true
          chk 'CONFIG_USE_BOOTCOMMAND=y'   'grep -q "^#define CONFIG_USE_BOOTCOMMAND" "$AUTOCONF"'
          chk 'CONFIG_BOOTCOMMAND 非空'    'grep -q "^#define CONFIG_BOOTCOMMAND" "$AUTOCONF"'

          echo "=== 2. MTD / NMBM（关错会 undefined reference to mtd_*）==="
          grep -E '^(CONFIG_MTD|CONFIG_DM_MTD|CONFIG_MTD_SPI_NAND|CONFIG_ENABLE_NAND_NMBM|CONFIG_NMBM|CONFIG_NMBM_MTD)=' "$CFG" || true
          chk 'CONFIG_MTD=y' 'grep -q "^CONFIG_MTD=y" "$CFG"'

          echo "=== 3. 开机菜单补丁（应改源码而不是关 Kconfig）==="
          # 三个宏必须保持全开: 关 MEDIATEK_BOOTMENU 会丢 mtd_helper.o(备份/刷机挂),
          # 关 AUTOBOOT_MENU_SHOW 会丢 menu_show(链接挂)。菜单靠补丁跳过。
          grep -E '^(CONFIG_MENU|CONFIG_CMD_BOOTMENU|CONFIG_MEDIATEK_BOOTMENU|CONFIG_AUTOBOOT_MENU_SHOW|CONFIG_AUTOBOOT_MENU_MTK_SHOW)=' "$CFG" || true
          chk 'MEDIATEK_BOOTMENU=y（否则备份/刷机没 mtd_helper）' \
              'grep -q "^CONFIG_MEDIATEK_BOOTMENU=y" "$CFG"'
          chk 'AUTOBOOT_MENU_SHOW=y（否则 menu_show 没定义, 链接挂）' \
              'grep -q "^CONFIG_AUTOBOOT_MENU_SHOW=y" "$CFG"'
          chk 'autoboot.c 菜单开关已被改成 if (0)' \
              'grep -q "if (0) { /\* 360T7" uboot-mtk-20250711/common/autoboot.c'

          echo "=== 4. 倒计时 ==="
          grep -E '^(CONFIG_BOOTDELAY|CONFIG_AUTOBOOT)=' "$CFG" || true
          chk 'CONFIG_BOOTDELAY>=0' 'grep -qE "^CONFIG_BOOTDELAY=[0-9-]+$" "$CFG"'

          echo "=== 5. 默认 env 里的 bootcmd ==="
          for h in uboot-mtk-20250711/include/generated/defaultenv_autogenerated.h \
                   uboot-mtk-20250711/include/generated/defaultenv.h; do
            [ -f "$h" ] && { grep -o 'bootcmd=[^"]*' "$h" || true; }
          done

          echo "=== 产物 ==="
          ls -l output/

          echo
          if [ "$FAIL" = "0" ]; then
            echo "===== 自检通过: 可以刷 ====="
          else
            echo "===== 自检未通过: 上面带 !! 的项要修, 先别刷 ====="
          fi
          exit 0

      - name: 整理产物
        run: |
          cd bl-mt798x-dhcpd
          mkdir -p upload
          cp -r output/* upload/ 2>/dev/null || true
          ls -l upload/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 360T7-uboot-${{ matrix.version }}-${{ env.FILE_DATE }}
          path: bl-mt798x-dhcpd/upload/*
