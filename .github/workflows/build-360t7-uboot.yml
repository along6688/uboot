name: 360T7 U-Boot 2025 (备份/Factory/DHCP)

on:
  workflow_dispatch:
    inputs:
      VARIANT:
        description: '分区布局: default=原厂/通用(与你现有分区一致, 推荐) / ubootmod=OpenWrt UBI 布局 / nonmbm=关闭 NMBM'
        required: true
        default: 'default'
        type: choice
        options:
          - default
          - ubootmod
          - nonmbm
      BOOTMODE:
        description: '启动卷: kernel=SWRT/华硕官改(实测卷名就是 kernel) / fit=旧版 uboot 的 OpenWrt ITB 卷 / production=新版默认'
        required: true
        default: 'kernel'
        type: choice
        options:
          - kernel
          - fit
          - production
      VERSION:
        description: 'ATF 版本: all=三个都编(推荐, 挑能用的) / SP1=ATF 20241017(老内核固件更稳) / 2025=最新 / SP2=ATF 20260123'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - SP1
          - 2025
          - SP2
      DHCPD:
        description: '开启 DHCP 服务(电脑自动获取 IP, 无需手动设静态 IP)'
        required: false
        default: 'true'
        type: boolean
      ENVFIX:
        description: '避开旧 bootcmd: 把 env 挪到 u-boot-env 分区后半段, 旧 uboot 残留的 bootcmd 就失效了(刷上即用)'
        required: false
        default: 'true'
        type: boolean
      SIMG:
        description: '开启全片镜像(SIMG)升级'
        required: false
        default: 'true'
        type: boolean
      NAND_RAW:
        description: '开启 NAND 原始(OOB)备份, 含坏块信息, 还原最完整但风险高'
        required: false
        default: 'false'
        type: boolean
      FSTHEME:
        description: '救援界面主题'
        required: false
        default: 'bootstrap'
        type: choice
        options:
          - bootstrap
          - gl
          - mtk

env:
  TZ: Asia/Shanghai
  MODEL: qihoo_360t7
  VARIANT: ${{ github.event.inputs.VARIANT || 'default' }}
  BOOTMODE: ${{ github.event.inputs.BOOTMODE || 'kernel' }}
  DHCPD: ${{ github.event.inputs.DHCPD || 'true' }}
  ENVFIX: ${{ github.event.inputs.ENVFIX || 'true' }}
  SIMG: ${{ github.event.inputs.SIMG || 'true' }}
  NAND_RAW: ${{ github.event.inputs.NAND_RAW || 'false' }}
  FSTHEME: ${{ github.event.inputs.FSTHEME || 'bootstrap' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # VERSION=all 时三个 ATF 版本都编, 挑能启动的那个刷
        version: ${{ fromJSON(github.event.inputs.VERSION == 'all' && '["SP1","2025","SP2"]' || format('["{0}"]', github.event.inputs.VERSION || 'SP1')) }}
    env:
      VERSION: ${{ matrix.version }}

    steps:
      - name: 检出源码
        run: |
          git clone --depth 1 https://github.com/Yuzhii0718/bl-mt798x-dhcpd bl-mt798x-dhcpd
          echo "SOURCE_SHA=$(git -C bl-mt798x-dhcpd rev-parse HEAD)" >> $GITHUB_ENV

      - name: 安装编译依赖
        run: |
          sudo -E apt-get -qq update
          PKGS="gcc-aarch64-linux-gnu build-essential flex bison libssl-dev device-tree-compiler qemu-user-static rename tar"
          if [ -f bl-mt798x-dhcpd/depends/ubuntu-22.04 ]; then
            PKGS="$PKGS $(cat bl-mt798x-dhcpd/depends/ubuntu-22.04)"
          fi
          sudo -E apt-get -qq install $PKGS
          sudo timedatectl set-timezone "$TZ"

      - name: 开启功能开关
        run: |
          set -e
          cd bl-mt798x-dhcpd
          case "$VARIANT" in
            default)  CFG=uboot-mtk-20250711/configs/mt7981_qihoo_360t7_defconfig ;;
            nonmbm)   CFG=uboot-mtk-20250711/configs-nonmbm/mt7981_qihoo_360t7_defconfig ;;
            ubootmod) CFG=uboot-mtk-20250711/configs-ubi/mt7981_qihoo_360t7_defconfig ;;
            *) echo "未知 VARIANT: $VARIANT"; exit 1 ;;
          esac
          echo "机型配置: $CFG"
          # 三条命令必须用分号隔开(等价于逐条回车), 连在一起写只会被当成一条命令
          case "$BOOTMODE" in
            kernel)     BCMD='ubi part ubi ; ubi read 0x46000000 kernel ; bootm 0x46000000' ;;
            fit)        BCMD='ubi part ubi ; ubi read 0x46000000 fit ; bootm 0x46000000' ;;
            production) BCMD='' ;;
          esac
          echo "BCMD=$BCMD" >> $GITHUB_ENV
          {
            echo ''
            echo '# ===== 360T7 自定义功能 ====='
            echo 'CONFIG_MTK_WEB_FAILSAFE=y'
            echo 'CONFIG_MTK_WEB_FAILSAFE_AFTER_BOOT_FAILURE=y'
            if [ "$DHCPD" = "true" ]; then
              echo 'CONFIG_MTK_DHCPD=y'
              echo 'CONFIG_MTK_DHCPD_USE_CONFIG_IP=y'
            fi
            echo 'CONFIG_WEBUI_FAILSAFE_BACKUP=y'
            echo 'CONFIG_WEBUI_FAILSAFE_FACTORY=y'
            echo 'CONFIG_WEBUI_FAILSAFE_ADVANCED=y'
            echo 'CONFIG_WEBUI_FAILSAFE_FLASH=y'
            echo 'CONFIG_WEBUI_FAILSAFE_CONSOLE=y'
            echo 'CONFIG_WEBUI_FAILSAFE_ENV=y'
            echo 'CONFIG_WEBUI_FAILSAFE_I18N=y'
            # 旧版 uboot 靠 Boot Menu 自动探测, 新版默认走 production/recovery 卷,
            # 而 SWRT/华硕官改固件的实际卷名是 kernel —— 对不上就起不来。
            # 注意: CONFIG_USE_BOOTCOMMAND 在 Kconfig 里没有 default(默认 n),
            #       不开它的话 CONFIG_BOOTCOMMAND 会被 olddefconfig 直接丢掉。
            if [ -n "$BCMD" ]; then
              echo 'CONFIG_USE_BOOTCOMMAND=y'
              echo "CONFIG_BOOTCOMMAND=\"$BCMD\""
            fi
          } >> "$CFG"
          # ---- ENVFIX: 让编译进去的 bootcmd 真正生效(刷上就能用) ----
          # u-boot-env 分区 512k, 旧 uboot 把 env 写在偏移 0。
          # 新 uboot 上电先读 flash env, 读到就完全不听编译值了 —— 所以必须让它读不到。
          # 挪到 0x40000(256k 处): 128k / 256k 两种擦除块大小都能对齐,
          # 且 env 区 0x40000~0x60000 仍在 512k 分区内, 不会越界。
          # 读不到旧 env -> CRC 校验失败 -> 自动用编译内置默认 env(里面就是我们要的 bootcmd)。
          # sed 必须放在上面的追加块之后: 块内 sed -i 会换 inode, 后面的 echo 会写飞。
          if [ "$ENVFIX" = "true" ]; then
            sed -i '/^CONFIG_ENV_OFFSET=/d' "$CFG"
            echo '# 避开旧 uboot 残留的 env, 把 env 挪到 u-boot-env 分区后半段' >> "$CFG"
            echo 'CONFIG_ENV_OFFSET=0x40000' >> "$CFG"
          fi
          echo "--- 追加的开关 ---"
          tail -22 "$CFG"

      - name: 修正默认 env 文件(双保险)
        run: |
          set -e
          cd bl-mt798x-dhcpd/uboot-mtk-20250711/defenvs || exit 0
          if [ -z "$BCMD" ]; then echo 'BOOTMODE=production, 跳过'; exit 0; fi
          # 源码里 defenvs/qihoo-360t7_env 默认 bootcmd=...run boot_ubi...,
          # 而 boot_ubi -> boot_production -> ubi read fit, SWRT 没有 fit 卷, 必挂。
          # 万一走了 defenvs 这条路, 这里直接把 bootcmd 改成对的。
          for f in qihoo-360t7_env qihoo-360t7-ubi_env custom_env; do
            [ -f "$f" ] || continue
            echo "修正 $f"
            sed -i '/^bootcmd=/d' "$f"
            printf 'bootcmd=%s\n' "$BCMD" >> "$f"
          done

      - name: 生成 .config
        run: |
          set -e
          cd bl-mt798x-dhcpd
          touch uboot-mtk-20250711/.config
          make defconfig 2>&1 || true
          touch .config
          config_apply() {
            local key="$1" value="$2"
            if [ "$value" = "y" ]; then
              sed -i "s/^# $key is not set\$/$key=y/" .config
              grep -q "^$key=" .config || echo "$key=y" >> .config
            elif [ "$value" = "n" ]; then
              sed -i "s/^$key=y\$/# $key is not set/" .config
            else
              sed -i "s|^$key=.*|$key=$value|" .config
              grep -q "^$key=" .config || echo "$key=$value" >> .config
            fi
          }
          config_apply CONFIG_BUILD_FIP y
          config_apply CONFIG_BUILD_ATF n
          config_apply CONFIG_BUILD_GPT n
          config_apply CONFIG_COPY_BL2 y
          config_apply CONFIG_VERSION_2025 n
          config_apply CONFIG_VERSION_SP1 n
          config_apply CONFIG_VERSION_SP2 n
          case "$VERSION" in
            2025) config_apply CONFIG_VERSION_2025 y ;;
            SP1)  config_apply CONFIG_VERSION_SP1 y ;;
            SP2)  config_apply CONFIG_VERSION_SP2 y ;;
            *) echo "未知 VERSION: $VERSION"; exit 1 ;;
          esac
          config_apply CONFIG_VARIANT_DEFAULT n
          config_apply CONFIG_VARIANT_NONMBM n
          config_apply CONFIG_VARIANT_UBOOTMOD n
          config_apply CONFIG_VARIANT_UBI n
          config_apply CONFIG_VARIANT_OPENWRT n
          case "$VARIANT" in
            default)  config_apply CONFIG_VARIANT_DEFAULT y ;;
            nonmbm)   config_apply CONFIG_VARIANT_NONMBM y ;;
            ubootmod) config_apply CONFIG_VARIANT_UBOOTMOD y ;;
          esac
          config_apply CONFIG_FSTHEME_BOOTSTRAP n
          config_apply CONFIG_FSTHEME_GL n
          config_apply CONFIG_FSTHEME_MTK n
          config_apply "CONFIG_FSTHEME_$(echo "$FSTHEME" | tr '[:lower:]' '[:upper:]')" y
          config_apply CONFIG_MULTI_LAYOUT n
          config_apply CONFIG_FIXED_MTDPARTS y
          config_apply CONFIG_SIMG "$([ "$SIMG" = "true" ] && echo y || echo n)"
          config_apply CONFIG_NAND_RAW "$([ "$NAND_RAW" = "true" ] && echo y || echo n)"
          config_apply CONFIG_SILENT y
          config_apply CONFIG_BUILD_LOG y
          echo "=== 最终 .config ==="
          cat .config

      - name: 编译 FIP
        run: |
          cd bl-mt798x-dhcpd
          mkdir -p output
          make BOARD=qihoo_360t7 VERSION="$VERSION" VARIANT="$VARIANT" MULTI_LAYOUT=0 FIXED_MTDPARTS=1 build 2>&1
          echo "FILE_DATE=$(date +%Y.%m.%d-%H%M)" >> $GITHUB_ENV
          echo "=== 产物 ==="
          ls -l output/

      - name: 自检编译结果
        run: |
          cd bl-mt798x-dhcpd
          echo "=== env 位置配置 ==="
          grep -E '^(CONFIG_ENV_OFFSET|CONFIG_ENV_SIZE|CONFIG_ENV_IS_IN_MTD|CONFIG_ENV_MTD_DEV|CONFIG_ENV_MTD_NAME)=' uboot-mtk-20250711/.config || true
          echo "=== 编译进去的 bootcmd ==="
          grep -E 'define CONFIG_(USE_BOOTCOMMAND|BOOTCOMMAND)' uboot-mtk-20250711/include/config/autoconf.h \
            || echo '!! 没有 CONFIG_BOOTCOMMAND, 刷上不会自动启动'
          echo "=== 默认 env 里的 bootcmd 实际值 ==="
          for h in uboot-mtk-20250711/include/generated/defaultenv_autogenerated.h \
                   uboot-mtk-20250711/include/generated/defaultenv.h; do
            [ -f "$h" ] && grep -o 'bootcmd=[^"]*' "$h"
          done
          echo "=== 产物 ==="
          ls -l output/

      - name: 整理产物
        run: |
          cd bl-mt798x-dhcpd
          mkdir -p upload
          cp -r output/* upload/ 2>/dev/null || true
          ls -l upload/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 360T7-uboot-${{ matrix.version }}-${{ env.FILE_DATE }}
          path: bl-mt798x-dhcpd/upload/*
